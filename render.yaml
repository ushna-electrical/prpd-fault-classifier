services:
  - type: web
    name: prpd-fault-classifier-api
    runtime: python
    rootDir: webapp/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PRPD_CORS_ORIGINS
        sync: false  # set in the Render dashboard to your Vercel/Netlify URL(s)
    healthCheckPath: /api/health
